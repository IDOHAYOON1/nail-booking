<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#c96060" />
  <meta name="description" content="קביעת תורים לסטודיו ציפורניים" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />

  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nails 💅" />
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <!-- Prevent zoom on input focus (iOS) -->
  <meta name="format-detection" content="telephone=no" />

  <title>Nails by Dana 💅</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root {
      height: 100%;
      background: #0d0d0d;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    /* Safe area for iPhone notch / home bar */
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    // Register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(r => console.log('SW registered'))
          .catch(e => console.log('SW error', e));
      });
    }
  </script>
</body>
</html>
